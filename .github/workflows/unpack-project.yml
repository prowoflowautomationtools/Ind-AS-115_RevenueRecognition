
name: Unpack Flutter Project

on:
  push:
    paths:
      - ind-as115-flutter-mvp.zip

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project files
        run: |
          mkdir -p /tmp/ind-as115
          unzip -o ind-as115-flutter-mvp.zip -d /tmp/ind-as115
          cp -R /tmp/ind-as115/. .
          rm ind-as115-flutter-mvp.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Ind AS 115 Flutter project"
          git push
          
